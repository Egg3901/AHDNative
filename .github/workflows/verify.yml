name: verify
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - name: Validate shared rules provenance
        id: rules
        run: |
          node scripts/shared-rules.mjs --verify
          node --input-type=module -e 'import fs from "node:fs"; const p = JSON.parse(fs.readFileSync("packages/game-rules/provenance.json", "utf8")); fs.appendFileSync(process.env.GITHUB_OUTPUT, `revision=${p.revision}\n`);'
      - name: Read pinned authoritative rules
        uses: actions/checkout@v4
        with:
          repository: Egg3901/AHDGame
          ref: ${{ steps.rules.outputs.revision }}
          path: .reference-game
          persist-credentials: false
      - name: Compare package with authoritative source
        env:
          RULES_REVISION: ${{ steps.rules.outputs.revision }}
        run: node scripts/shared-rules.mjs --check --source .reference-game --revision "$RULES_REVISION"
      - run: npm run verify
      - run: npm run test:ci --workspace @ahdclient/engine -- --maxWorkers 2
      - run: npm run test:ci --workspace @ahdclient/content -- --maxWorkers 1
      - run: npx playwright install --with-deps chromium
      - run: npm run test:smoke
        env:
          SMOKE_PRODUCTION: "1"
      - run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
