name: Bug report
description: Something is broken in the app or the codebase
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Is this an exploit or vulnerability?** Do NOT file it here - report it privately to the owner, never in a public issue.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Steps, mode (local SP world or later MP), screen, or a failing test.
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      placeholder: screen, session/worker boundary, save store, or turn step
