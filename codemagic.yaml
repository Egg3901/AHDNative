# Manual only. Never attach signed artifacts to public GitHub runs or releases.
workflows:
  ios-private-testflight:
    name: Private iOS TestFlight build
    instance_type: mac_mini_m2
    max_build_duration: 20
    environment:
      node: 22
      xcode: latest
      groups:
        - ahdnative-signing
    cache:
      cache_paths:
        - $HOME/.npm
        - $HOME/.cargo/registry
        - $HOME/.cargo/git
        - $CM_BUILD_DIR/src-tauri/target
    scripts:
      - name: Check private signing inputs
        script: |
          set -eu
          python3 - <<'PYTHON'
          import os
          required = ["IOS_CERTIFICATE", "IOS_CERTIFICATE_PASSWORD", "IOS_MOBILE_PROVISION",
                      "TAURI_APPLE_DEVELOPMENT_TEAM", "APP_STORE_CONNECT_PRIVATE_KEY",
                      "APP_STORE_CONNECT_KEY_IDENTIFIER", "APP_STORE_CONNECT_ISSUER_ID"]
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit("Missing encrypted signing variables: " + ", ".join(missing))
          print("Private signing inputs present")
          PYTHON
      - name: Install dependencies and check frontend
        script: |
          set -eu
          npm ci
          npm run verify
      - name: Prepare Rust for iOS
        script: |
          set -eu
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
          rustup target add aarch64-apple-ios --toolchain 1.96.0
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Generate iOS project
        script: npm run tauri -- ios init --ci --skip-targets-install
      - name: Restrict export to internal TestFlight
        script: |
          set -eu
          python3 - <<'PYTHON'
          import plistlib
          from pathlib import Path
          path = Path("src-tauri/gen/apple/ExportOptions.plist")
          options = plistlib.loads(path.read_bytes()) if path.exists() else {}
          options["testFlightInternalTestingOnly"] = True
          path.write_bytes(plistlib.dumps(options))
          PYTHON
      - name: Build signed iPhone application
        script: |
          set -eu
          npm run tauri -- ios build --ci --target aarch64 --export-method app-store-connect --build-number "$BUILD_NUMBER"
    artifacts:
      - src-tauri/gen/apple/build/**/*.ipa
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: false
        submit_to_app_store: false
