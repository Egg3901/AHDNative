[package]
name = "ahdnative"
version = "0.1.1"
description = "A House Divided native application shell"
authors = ["Lakeside Games"]
repository = "https://github.com/Egg3901/AHDNative"
edition = "2021"
rust-version = "1.77.2"
publish = false

[lib]
name = "ahdnative_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
tauri = { version = "2.11.3" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
